name: Deploy Surreal Dream Mall

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-surreal-dream-mall.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Pages repository
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout game source
        uses: actions/checkout@v4
        with:
          repository: aaanoifjia/personal-Website
          ref: main
          path: source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install game dependencies
        working-directory: source/games/surreal-dream-mall
        run: npm install

      - name: Build game
        working-directory: source/games/surreal-dream-mall
        run: npm run build

      - name: Copy build into GitHub Pages
        run: |
          rm -rf site/surreal-dream-mall
          mkdir -p site/surreal-dream-mall
          cp -R source/games/surreal-dream-mall/dist/. site/surreal-dream-mall/
          touch site/.nojekyll

      - name: Commit generated browser build
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surreal-dream-mall .nojekyll
          if git diff --cached --quiet; then
            echo "No build changes to commit."
            exit 0
          fi
          git commit -m "deploy: surreal dream mall browser build"
          git push
