name: Deploy Surreal Dream Mall

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-surreal-dream-mall.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Pages repository
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout game source
        uses: actions/checkout@v4
        with:
          repository: aaanoifjia/personal-Website
          ref: main
          path: source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install game dependencies
        working-directory: source/games/surreal-dream-mall
        run: npm install

      - name: Build game
        working-directory: source/games/surreal-dream-mall
        run: npm run build

      - name: Sync Pages branch and generate lightweight collision mesh
        run: |
          git -C site fetch origin main
          git -C site reset --hard origin/main
          mkdir -p site/surreal-dream-mall/assets
          python -m pip install --quiet numpy trimesh
          python source/games/surreal-dream-mall/scripts/optimize_collider.py \
            site/surreal-dream-mall/assets/collider.glb \
            site/surreal-dream-mall/assets/collider-web.glb

      - name: Copy build without overwriting manually uploaded assets
        run: |
          # Preserve previous hashed bundles so cached HTML pages still boot.
          rsync -a \
            --exclude='assets/mall.sog' \
            --exclude='assets/collider.glb' \
            --exclude='assets/collider-web.glb' \
            --exclude='assets/player.glb' \
            --exclude='assets/README.md' \
            source/games/surreal-dream-mall/dist/ site/surreal-dream-mall/
          touch site/.nojekyll

      - name: Verify HTML references existing JS and CSS before publishing
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          class AssetReferences(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []

              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in ('src', 'href') and value and value.startswith('./assets/'):
                          self.refs.append(value.split('?', 1)[0])

          for folder in (Path('source/games/surreal-dream-mall/dist'),
                         Path('site/surreal-dream-mall')):
              parser = AssetReferences()
              parser.feed((folder / 'index.html').read_text())
              scripts = [ref for ref in parser.refs if ref.endswith('.js')]
              if not scripts:
                  raise SystemExit(f'{folder}: missing JS entry in HTML')
              for asset in parser.refs:
                  if not (folder / asset).is_file():
                      raise SystemExit(f'{folder}: missing asset referenced by HTML: {asset}')
              print(f'{folder}: verified {len(parser.refs)} referenced build assets')
          PY

      - name: Commit generated browser build
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surreal-dream-mall .nojekyll
          if git diff --cached --quiet; then
            echo "No build changes to commit."
            exit 0
          fi
          git commit -m "deploy: surreal dream mall browser build"
          git push
